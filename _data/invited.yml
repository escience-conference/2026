- title: From Workflows to Swarms:Distributed Intelligence for a Resilient and Adaptive Computing Continuum
  name: Anirban Mandal
  time:
  author: Anirban Mandal
  institution: Renaissance Computing Institute, UNC Chapel Hill, USA
  abstract: Scientific workflows increasingly span sensors, instruments, edge devices, programmable networks, clouds, and HPC facilities. In this computing continuum, resources appear and disappear, network conditions change, failures propagate across layers, and decisions often must be made close to where data is produced. Treating the continuum as a collection of static resources managed by a centralized scheduler is becoming increasingly inadequate.This talk traces a journey from conventional scientific workflows to adaptive edge-to-core execution and, ultimately, distributed, decentralized, multi-agent workflow management. I will describe experiments in dynamic computation placement, programmable network services, controlled anomaly injection, high-throughput data transport, and decentralized workload selection. A recurring theme is the role of research testbeds - particularly FABRIC - as "digital wind tunnels" where new infrastructure ideas can be subjected to realistic network conditions, controlled failures, and repeatable experiments before real-world deployment. I will outline a vision for an adaptive computing continuum in which distributed agents observe, negotiate, and act while remaining explainable, reproducible, and aligned with scientific intent.
  biography: Anirban Mandal is Director of the Network Research and Infrastructure Group at RENCI, University of North Carolina at Chapel Hill. His research spans distributed systems, scientific workflows, cloud and edge computing, networking, and research cyberinfrastructure, with an emphasis on adaptive resource management, resilient infrastructure, performance analysis, and anomaly detection. He leads and contributes to multi-institutional NSF and DOE projects exploring edge-to-core workflows, programmable network testbeds, and distributed agent-based workflow management. Mandal received his Ph.D. in Computer Science from Rice University in 2006 and his B.Tech. from IIT Bombay in 2000.
  photo: invited-mandal.png

